<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --primary: #2563EB;
            --success: #16A34A;
            --danger: #DC2626;
            --bg: #DBEAFE;
            --white: #FFFFFF;
        }

        body {
            background: var(--bg);

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;
        }

        .container {
            width: 400px;

            background: var(--white);

            padding: 2rem;

            border-radius: 10px;

            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;

            margin-bottom: 25px;

            color: var(--primary);
        }

        label {
            display: block;

            margin-top: 15px;

            margin-bottom: 5px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 10px;

            border: 1px solid gray;

            border-radius: 5px;

            font-size: 1rem;
        }

        input::placeholder {
            color: gray;
        }

        input:focus {
            outline: none;

            border: 2px solid var(--primary);
        }

        input:read-only {
            background: #eeeeee;

            cursor: not-allowed;
        }

        input:required {
            border-left: 4px solid rgb(21, 3, 17);
        }

        input:valid {
            border-color: green;
        }

        input:invalid {
            border-color: red;
        }

        input[type="number"]:in-range {
            background: #d8ffd8;
        }

        input[type="number"]:out-of-range {
            background: #d89e9e;
        }

        .terms {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 20px;
        }

        .terms input {
            width: auto;
        }

        #check:checked {
            accent-color: green;
        }

        #check:checked + label {
            color: green;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background: var(--primary);

            color: white;

            font-size: 1rem;

            cursor: pointer;
        }

        button:hover {
            background: var(--success);
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Student Registration Form</h1>

        <form>

            <label>Student ID</label>

            <input
                type="text"
                value="STD2026001"
                readonly
            >

            <label>Full Name</label>

            <input
                type="text"
                placeholder="Enter Full Name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                placeholder="Enter Email"
                required
            >

            <label>Age</label>

            <input
                type="number"
                min="18"
                max="30"
                placeholder="Enter Age"
                required
            >

            <div class="terms">

                <input
                    type="checkbox"
                    id="check"
                >

                <label for="check">
                    I Accept Terms & Conditions
                </label>

            </div>

            <button>
                Register
            </button>

        </form>

    </div>

</body>

</html>
